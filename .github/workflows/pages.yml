name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # better-sqlite3 requires Node >= 22; its linux-x64 prebuild segfaults
          # on 20. The build only started needing it once the renderer moved off
          # PHP, so this pin went stale silently.
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The action's default is 600000 (10 min), and on 2026-08-06 two
          # deploys in a row sat in `deployment_queued` for exactly that long
          # and were cancelled — a Pages queue delay, not a build problem.
          # Worse, once a commit's deployment is cancelled, re-running the job
          # recreates the same deployment ID and it is cancelled immediately,
          # so the only recovery was a new commit. Waiting longer is cheap;
          # failing a green build because the queue was slow is not.
          timeout: 1800000
