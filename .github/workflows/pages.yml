name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time, but never cancel one that is already running.
# GitHub's own starter workflow for Pages sets cancel-in-progress: false for
# exactly this reason — a production deployment should be allowed to finish.
# This repo had `true`, and on 2026-08-06 overlapping runs cancelled each
# other's in-flight deployment repeatedly; every deployment afterwards sat in
# `deployment_queued` until it timed out, six runs in a row.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # better-sqlite3 requires Node >= 22; its linux-x64 prebuild segfaults
          # on 20. The build only started needing it once the renderer moved off
          # PHP, so this pin went stale silently.
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Do not add `with: timeout:` here. 600000 ms (10 min) is the action's
      # MAXIMUM, not just its default: a larger value is silently clamped back
      # with "Warning: timeout value is greater than the allowed maximum".
      # Tried on 2026-08-06 (1800000) while deploys were stalling in
      # `deployment_queued` — it changed nothing, because the cap is hard.
      # When a deploy fails that way the queue is the problem, not this file.
      # Note that re-running does NOT recover it: a Pages deployment is keyed
      # on the commit sha, so a re-run recreates the same deployment ID and it
      # is cancelled within seconds. A new commit is the only way forward.
      - id: deployment
        uses: actions/deploy-pages@v4
