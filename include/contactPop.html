<div
	id="ContactUsPop"
	class="PopOverlay"
	role="dialog"
	aria-modal="true"
	aria-labelledby="ContactUsPopTitle"
	aria-hidden="true"
>
	<div class="Pop">
		<button
			type="button"
			class="PopClose"
			aria-label="닫기"
		>
			<svg
				class="GnbToggleClose"
				viewBox="0 0 24 24"
				aria-hidden="true"
			>
				<line
					x1="5"
					y1="5"
					x2="19"
					y2="19"
				/>
				<line
					x1="19"
					y1="5"
					x2="5"
					y2="19"
				/>
			</svg>
		</button>
		<div class="ContactUsWrap">
			<h2 id="ContactUsPopTitle">Contact Us</h2>
			<div class="ContactTop">
				<p>
					스마트 팩토리와 물류 자동화를 위한 최고의 파트너가 되겠습니다.
					<br />
					문의를 남겨주시면 전문 담당자가 빠르게 답변드리겠습니다.
				</p>
			</div>
			<div class="ContactUnder">
				<div class="ContactLeft">
					<form
						action=""
						class="ContactForm"
					>
						<div class="ContactUsInputGroup">
							<input
								type="text"
								id="name"
								name="name"
								placeholder="Name"
								required
							/>
						</div>
						<div class="ContactUsInputGroup">
							<input
								type="text"
								id="email"
								name="email"
								placeholder="Email"
								required
							/>
						</div>
						<div class="ContactUsInputGroup">
							<textarea
								id="message"
								name="message"
								rows="5"
								placeholder="Message"
								required
							></textarea>
						</div>
						<button
							type="submit"
							class="SendBtn"
						>
							Send
						</button>
					</form>
				</div>
				<div class="ContactRight">
					<div class="ContactRightVisit">
						<h3>회사주소</h3>
						<p>경기 시흥시 서울대학로 59-21, 로얄팰리스테크노1차 703</p>
					</div>
					<div class="ContactRightTalk">
						<h3>연락처 및 이메일</h3>
						<p>
							TEL. +82-70-7734-7890
							<br />
							FAX. +82-303-0951-0852
							<br />
							Email: info@agvsk.com
						</p>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
<div
	class="PopBackdrop"
	aria-hidden="true"
></div>
